<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biodata Siswa - Sistem CRUD</title>
<!-- Font Google -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #eef2f7;
    --kartu: #ffffff;
    --teks: #14213d;
    --teks-redup: #5b667a;
    --garis: #d6dde8;
    --aksen: #1d4ed8;
    --bahaya: #d93838;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0e1522;
        --kartu: #172033;
        --teks: #e8edf6;
        --teks-redup: #98a4ba;
        --garis: #2a3650;
        --aksen: #6c9bff;
        --bahaya: #ff8b80;
    }
}

* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--teks);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
}

.wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; }
header p { margin: 0; color: var(--teks-redup); }

/* Header & Tombol Utama */
.header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
}

/* Kolom pencarian dan filter */
.kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
.kontrol input, .kontrol select, .btn {
    font: inherit;
    color: var(--teks);
    background: var(--kartu);
    border: 1px solid var(--garis);
    border-radius: 10px;
    padding: 10px 12px;
}
.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 0 1 160px; }

.btn {
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
}
.btn-primary {
    background: var(--aksen);
    color: #fff;
    border: none;
}
.btn-primary:hover { opacity: 0.9; }
.btn-danger {
    background: transparent;
    color: var(--bahaya);
    border: 1px solid var(--bahaya);
}
.btn-danger:hover { background: var(--bahaya); color: #fff; }
.btn-secondary { background: transparent; }

.jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }

/* Susunan kartu */
.daftar {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
}

/* Kartu siswa */
.kartu {
    background: var(--kartu);
    border: 1px solid var(--garis);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.pita { height: 56px; background: pink;}
.isi { padding: 0 16px 16px; text-align: center; flex: 1; }
.foto {
    width: 76px; height: 76px;
    margin: -38px auto 8px;
    border-radius: 50%;
    border: 4px solid var(--kartu);
    background: hsl(var(--hue) 55% 88%);
    color: hsl(var(--hue) 65% 28%);
    display: grid; place-items: center;
    font-weight: 800; font-size: 1.5rem;
    overflow: hidden;
}
.foto img { width: 100%; height: 100%; object-fit: cover; }
.nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
.nis { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }
.rincian { margin: 0; text-align: left; font-size: 0.9rem; }
.rincian div {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 0; border-top: 1px solid var(--garis);
}
.rincian dt { color: var(--teks-redup); }
.rincian dd { margin: 0; font-weight: 600; text-align: right; }

.aksi-kartu {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--garis);
    background: rgba(0,0,0,0.02);
}
.aksi-kartu .btn { flex: 1; padding: 6px 8px; font-size: 0.85rem; }

/* Modal Form */
.modal-backdrop {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000;
    padding: 16px;
}
.modal-backdrop.sembunyi { display: none; }
.modal {
    background: var(--kartu);
    border-radius: 14px;
    width: 100%;
    max-width: 480px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
.modal h2 { margin-top: 0; font-size: 1.4rem; }
.form-grup { margin-bottom: 14px; text-align: left; }
.form-grup label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--teks-redup); }
.form-grup input, .form-grup select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--garis);
    background: var(--bg);
    color: var(--teks);
    font: inherit;
}
.modal-aksi { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* Pesan status */
.pesan {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 16px;
    color: var(--teks-redup);
}
.pesan.galat { color: var(--bahaya); }
</style>
</head>
<body>

<div class="wadah">
    <header class="header-bar">
        <div>
            <h1>Teknik Komputer dan Jaringan</h1>
            <p>Kelola data dan biodata siswa.</p>
        </div>
        <button id="btnTambah" class="btn btn-primary">+ Tambah Siswa</button>
    </header>

    <div class="kontrol">
        <input id="cari" type="search" placeholder="Cari nama atau NIS" aria-label="Cari nama atau NIS">
        <select id="filterKelas" aria-label="Filter kelas">
            <option value="">Semua kelas</option>
        </select>
    </div>
    <p id="jumlah" class="jumlah" aria-live="polite"></p>
    <main id="daftar" class="daftar"></main>
</div>

<!-- Modal Dialog Form (Create & Update) -->
<div id="modalForm" class="modal-backdrop sembunyi">
    <div class="modal">
        <h2 id="modalJudul">Tambah Siswa</h2>
        <form id="formSiswa">
            <!-- Menampung NIS lama saat melakukan Edit -->
            <input type="hidden" id="nisLama">

            <div class="form-grup">
                <label for="nis">NIS</label>
                <input type="text" id="nis" required placeholder="Contoh: 12345">
            </div>
            <div class="form-grup">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Nama Siswa">
            </div>
            <div class="form-grup">
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas" required placeholder="Contoh: XII TKJ 1">
            </div>
            <div class="form-grup">
                <label for="jenis_kelamin">Jenis Kelamin</label>
                <select id="jenis_kelamin" required>
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>
            <div class="form-grup">
                <label for="tanggal_lahir">Tanggal Lahir</label>
                <input type="date" id="tanggal_lahir">
            </div>
            <div class="form-grup">
                <label for="alamat">Alamat</label>
                <input type="text" id="alamat" placeholder="Jl. Raya No. 123">
            </div>
            <div class="form-grup">
                <label for="foto_url">URL Foto (Opsional)</label>
                <input type="url" id="foto_url" placeholder="https://...">
            </div>
            
            <div class="modal-aksi">
                <button type="button" id="btnBatal" class="btn btn-secondary">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
        </form>
    </div>
</div>

<!-- Library Supabase dari CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
// LANGKAH 1: PENGATURAN
const SUPABASE_URL = "https://garvfknxsgrmeyjmvdyw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhcnZma254c2dybWV5am12ZHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4Njk5NDksImV4cCI6MjEwNzQ0NTk0OX0.JNRutvw8z34NtCKA7NrTf3AgmYMrJks_OMs7rKCSopg";
    
const TAMPILKAN = {
    jenisKelamin: true,
    tanggalLahir: true,
    alamat: true, 
    foto_url: true
};

// LANGKAH 2: HUBUNGKAN KE SUPABASE
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const elDaftar = document.getElementById("daftar");
const elJumlah = document.getElementById("jumlah");
const elCari = document.getElementById("cari");
const elKelas = document.getElementById("filterKelas");

// Elemen Modal & Form
const elModal = document.getElementById("modalForm");
const elForm = document.getElementById("formSiswa");
const elModalJudul = document.getElementById("modalJudul");
const btnTambah = document.getElementById("btnTambah");
const btnBatal = document.getElementById("btnBatal");

let semuaSiswa = [];

// LANGKAH 3: READ (AMBIL DATA)
async function muatData() {
    tampilkanPesan("Memuat data siswa...");
    
    const { data, error } = await db
        .from("siswa")
        .select("nis, nama, kelas, jenis_kelamin, tanggal_lahir, alamat, foto_url")
        .order("nama");

    if (error) {
        console.error(error);
        tampilkanPesan("Data tidak bisa dimuat. Periksa URL, anon key, serta RLS di Supabase.", true);
        return;
    }

    semuaSiswa = data;
    isiPilihanKelas();
    tampilkanSiswa();
}

// LANGKAH 4: TAMPILKAN KARTU DAN TOMBOL AKSI
function tampilkanSiswa() {
    const kataKunci = elCari.value.trim().toLowerCase();
    const kelasDipilih = elKelas.value;

    const hasil = semuaSiswa.filter((s) => {
        const cocokKelas = !kelasDipilih || s.kelas === kelasDipilih;
        const cocokCari = !kataKunci || 
                          s.nama.toLowerCase().includes(kataKunci) || 
                          String(s.nis).toLowerCase().includes(kataKunci);
        return cocokKelas && cocokCari;
    });

    elJumlah.textContent = hasil.length + " dari " + semuaSiswa.length + " siswa";
    elDaftar.replaceChildren();

    if (hasil.length === 0) {
        tampilkanPesan(semuaSiswa.length === 0 ? "Belum ada data siswa." : "Tidak ada siswa yang cocok.");
        return;
    }

    hasil.forEach((s) => elDaftar.appendChild(buatKartu(s)));
}

function buatKartu(s) {
    const kartu = el("article", "kartu");
    kartu.style.setProperty("--hue", warnaKelas(s.kelas));
    kartu.appendChild(el("div", "pita"));

    const isi = el("div", "isi");
    const foto = el("div", "foto");
    
    if (s.foto_url) {
        const gambar = document.createElement("img");
        gambar.src = s.foto_url;
        gambar.alt = "Foto " + s.nama;
        gambar.loading = "lazy";
        gambar.onerror = () => foto.replaceChildren(document.createTextNode(inisial(s.nama)));
        foto.appendChild(gambar);
    } else {
        foto.textContent = inisial(s.nama);
    }

    isi.appendChild(foto);
    isi.appendChild(el("h2", "nama", s.nama));
    isi.appendChild(el("p", "nis", "NIS " + s.nis));

    const rincian = el("dl", "rincian");
    tambahBaris(rincian, "Kelas", s.kelas);
    if (TAMPILKAN.jenisKelamin) tambahBaris(rincian, "Jenis kelamin", s.jenis_kelamin);
    if (TAMPILKAN.tanggalLahir) tambahBaris(rincian, "Tanggal lahir", formatTanggal(s.tanggal_lahir));
    if (TAMPILKAN.alamat) tambahBaris(rincian, "Alamat", s.alamat);

    isi.appendChild(rincian);
    kartu.appendChild(isi);

    // Tombol Edit & Hapus (Aksi CRUD)
    const aksi = el("div", "aksi-kartu");
    
    const btnEdit = el("button", "btn btn-secondary", "Edit");
    btnEdit.onclick = () => bukaModalEdit(s);
    
    const btnHapus = el("button", "btn btn-danger", "Hapus");
    btnHapus.onclick = () => hapusSiswa(s.nis, s.nama);

    aksi.appendChild(btnEdit);
    aksi.appendChild(btnHapus);
    kartu.appendChild(aksi);

    return kartu;
}

// LANGKAH 5: CREATE & UPDATE (SIMPAN DATA)
elForm.onsubmit = async (e) => {
    e.preventDefault();

    const nisLama = document.getElementById("nisLama").value;
    const payload = {
        nis: document.getElementById("nis").value,
        nama: document.getElementById("nama").value,
        kelas: document.getElementById("kelas").value,
        jenis_kelamin: document.getElementById("jenis_kelamin").value,
        tanggal_lahir: document.getElementById("tanggal_lahir").value || null,
        alamat: document.getElementById("alamat").value || null,
        foto_url: document.getElementById("foto_url").value || null
    };

    let error;

    if (nisLama) {
        // Mode Update
        const res = await db.from("siswa").update(payload).eq("nis", nisLama);
        error = res.error;
    } else {
        // Mode Create
        const res = await db.from("siswa").insert([payload]);
        error = res.error;
    }

    if (error) {
        alert("Gagal menyimpan data: " + error.message);
    } else {
        tutupModal();
        muatData();
    }
};

// LANGKAH 6: DELETE (HAPUS DATA)
async function hapusSiswa(nis, nama) {
    if (!confirm(`Apakah Anda yakin ingin menghapus siswa ${nama} (NIS: ${nis})?`)) return;

    const { error } = await db.from("siswa").delete().eq("nis", nis);

    if (error) {
        alert("Gagal menghapus data: " + error.message);
    } else {
        muatData();
    }
}

// MANAJEMEN MODAL
function bukaModalTambah() {
    elForm.reset();
    document.getElementById("nisLama").value = "";
    document.getElementById("nis").disabled = false;
    elModalJudul.textContent = "Tambah Siswa";
    elModal.classList.remove("sembunyi");
}

function bukaModalEdit(siswa) {
    document.getElementById("nisLama").value = siswa.nis;
    document.getElementById("nis").value = siswa.nis;
    document.getElementById("nama").value = siswa.nama || "";
    document.getElementById("kelas").value = siswa.kelas || "";
    document.getElementById("jenis_kelamin").value = siswa.jenis_kelamin || "Laki-laki";
    document.getElementById("tanggal_lahir").value = siswa.tanggal_lahir || "";
    document.getElementById("alamat").value = siswa.alamat || "";
    document.getElementById("foto_url").value = siswa.foto_url || "";

    elModalJudul.textContent = "Edit Siswa";
    elModal.classList.remove("sembunyi");
}

function tutupModal() {
    elModal.classList.add("sembunyi");
}

btnTambah.onclick = bukaModalTambah;
btnBatal.onclick = tutupModal;

// FUNGSI BANTU
function el(tag, kelas, teks) {
    const e = document.createElement(tag);
    if (kelas) e.className = kelas;
    if (teks) e.textContent = teks;
    return e;
}

function tambahBaris(dl, label, nilai) {
    if (!nilai) return;
    const baris = el("div");
    baris.appendChild(el("dt", "", label));
    baris.appendChild(el("dd", "", nilai));
    dl.appendChild(baris);
}

function inisial(nama) {
    return nama ? nama.split(" ").filter(Boolean).slice(0, 2).map((k) => k[0].toUpperCase()).join("") : "?";
}

function warnaKelas(kelas) {
    let total = 0;
    for (const huruf of kelas || "") total += huruf.charCodeAt(0);
    return (total * 47) % 360;
}

function formatTanggal(teks) {
    if (!teks) return "";
    return new Date(teks + "T00:00:00").toLocaleDateString("id-ID", {
        day: "numeric", month: "long", year: "numeric"
    });
}

function tampilkanPesan(teks, galat) {
    elDaftar.replaceChildren(el("p", "pesan" + (galat ? " galat" : ""), teks));
}

function isiPilihanKelas() {
    const opsiDefault = elKelas.firstElementChild;
    elKelas.replaceChildren(opsiDefault);

    const daftarKelas = [...new Set(semuaSiswa.map((s) => s.kelas).filter(Boolean))].sort();
    daftarKelas.forEach((k) => {
        const opsi = el("option", "", k);
        opsi.value = k;
        elKelas.appendChild(opsi);
    });
}

elCari.addEventListener("input", tampilkanSiswa);
elKelas.addEventListener("change", tampilkanSiswa);

muatData();
</script>
</body>
</html>
